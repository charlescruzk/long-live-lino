<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Long Live Lino</title>
<style>
  :root { --ink: rgba(240, 236, 228, .9); --soft: rgba(222, 226, 248, .6); --faint: rgba(210, 216, 245, .28); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #000104; color: var(--ink); }
  body { font-family: "Avenir Next", "Avenir", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; user-select: none; }
  body.idle, body.idle * { cursor: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .hud { position: fixed; pointer-events: none; transition: opacity 2.4s ease, transform 2.4s cubic-bezier(.2, .7, .2, 1); }
  #quote {
    left: 50%; bottom: max(6.2vh, 22px); width: min(64vw, 900px); transform: translate(-50%, 6px); filter: blur(5px);
    text-align: center; font-family: "Didot", "Bodoni 72", serif; font-style: italic; font-size: clamp(17px, 1.6vw, 30px);
    line-height: 1.35; letter-spacing: .015em; color: rgba(240, 236, 228, .84); text-shadow: 0 0 24px rgba(150, 170, 255, .28);
    opacity: 0; transition: opacity 1.6s ease, transform 2.2s cubic-bezier(.2, .7, .2, 1), filter 1.6s ease;
  }
  #quote.on { opacity: 1; transform: translate(-50%, 0); filter: blur(0); }
  #quote.off { transition-duration: .9s, .9s, .9s; }
  @media (max-aspect-ratio: 1/1) { #quote { width: 86vw; bottom: max(5vh, 22px); } body.quoted #sig { opacity: 0 !important; } }
  #sig { right: max(5.5vw, 22px); bottom: max(7vh, 26px); text-align: right; font-size: clamp(9px, .74vw, 12px); letter-spacing: .46em; color: var(--faint); text-transform: uppercase; }
  #hint { left: 50%; top: max(5vh, 20px); transform: translateX(-50%); white-space: nowrap; font-size: clamp(9px, .72vw, 11px); letter-spacing: .4em; text-transform: uppercase; color: var(--soft); opacity: 0; }
  #hint.on { opacity: .7; }
  /* leaving a light */
  .ui { font-family: "Avenir Next", Avenir, sans-serif; }
  #composer {
    position: fixed; left: 50%; bottom: max(7vh, 20px); width: min(440px, calc(100vw - 32px)); transform: translate(-50%, 14px);
    padding: 22px 22px 16px; border-radius: 16px; background: rgba(7, 9, 20, .74); border: 1px solid rgba(255, 255, 255, .08);
    backdrop-filter: blur(16px) saturate(1.2); -webkit-backdrop-filter: blur(16px) saturate(1.2);
    box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .8), 0 0 60px rgba(255, 210, 150, .06);
    opacity: 0; pointer-events: none; transition: opacity .6s ease, transform .8s cubic-bezier(.2, .7, .2, 1);
  }
  #composer.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #composer .c-title { font-size: 10px; letter-spacing: .42em; text-transform: uppercase; color: var(--soft); margin-bottom: 14px; }
  #composer textarea, #composer input {
    display: block; width: 100%; background: transparent; border: 0; border-bottom: 1px solid rgba(255, 255, 255, .12);
    color: var(--ink); outline: none; padding: 8px 0; resize: none; transition: border-color .4s;
  }
  #composer textarea { font-family: "Didot", "Bodoni 72", serif; font-style: italic; font-size: 19px; line-height: 1.4; }
  #composer input { font-size: 13px; letter-spacing: .04em; margin-top: 10px; }
  #composer textarea:focus, #composer input:focus { border-color: rgba(255, 214, 160, .5); }
  #composer ::placeholder { color: rgba(220, 224, 245, .34); }
  #composer .c-row { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
  #composer .c-count { flex: 1; font-size: 10px; letter-spacing: .2em; color: var(--faint); }
  #composer button {
    font: inherit; font-size: 10px; letter-spacing: .32em; text-transform: uppercase; padding: 10px 16px; border-radius: 999px;
    background: transparent; color: var(--soft); border: 1px solid transparent; cursor: pointer; transition: all .3s;
  }
  #composer button:hover { color: var(--ink); }
  #composer button[type=submit] { color: #ffe2b8; border-color: rgba(255, 214, 160, .38); }
  #composer button[type=submit]:hover { background: rgba(255, 214, 160, .1); border-color: rgba(255, 214, 160, .7); }
  #composer button:disabled { opacity: .4; cursor: default; }
  #composer .c-status { min-height: 1em; margin-top: 8px; font-size: 11px; letter-spacing: .06em; color: var(--soft); }

  /* reading one */
  #note {
    position: fixed; left: 0; top: 0; max-width: min(320px, 70vw); pointer-events: none; opacity: 0;
    transition: opacity .9s ease; text-shadow: 0 0 18px rgba(0, 0, 0, .9);
  }
  #note.on { opacity: 1; }
  #note .n-msg { font-family: "Didot", "Bodoni 72", serif; font-style: italic; font-size: clamp(15px, 1.25vw, 21px); line-height: 1.4; color: rgba(255, 240, 220, .92); }
  #note .n-from { margin-top: .7em; font-size: 9px; letter-spacing: .36em; text-transform: uppercase; color: rgba(255, 214, 160, .62); }
  #note .n-msg:empty { display: none; }
  #note .n-msg:empty + .n-from { margin-top: 0; }

  #nogl { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; font-family: "Didot", serif; font-size: 22px; color: var(--soft); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="quote" class="hud"></div>
<div id="sig" class="hud">Long Live Lino</div>
<div id="hint" class="hud">Touch the sky to leave a light for Lino &nbsp;·&nbsp; touch a star to read one</div>
<form id="composer" class="ui" autocomplete="off">
  <div class="c-title">Leave a light for Lino</div>
  <textarea id="c-msg" maxlength="280" rows="3" placeholder="Write him a message (optional)"></textarea>
  <input id="c-name" maxlength="40" placeholder="Your name (leave blank to stay anonymous)">
  <div class="c-row"><span class="c-count" id="c-count"></span><button type="button" id="c-cancel">Cancel</button><button type="submit" id="c-send">Light it</button></div>
  <div class="c-status" id="c-status"></div>
</form>
<div id="note"><div class="n-msg"></div><div class="n-from"></div></div>
<div id="nogl">This tribute needs a browser with WebGL 2 (Chrome, Safari, Edge or Firefox).</div>

<script src="data.js"></script>
<script src="lights-config.js"></script>
<script>
(() => {
"use strict";
const D = window.LINO;
const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl2", { antialias: false, alpha: false, premultipliedAlpha: true, powerPreference: "high-performance" });
if (!gl) { document.getElementById("nogl").style.display = "flex"; return; }
const HDR = !!gl.getExtension("EXT_color_buffer_float");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ===================================================================== timing
const TRANS = 4.4;                    // seconds: one photo drifts into the next
const HOLD = 4.8, HOLD_EXTRA = 2.5, HOLD_QUOTE = 2.6, HOLD_TITLE = 7, HOLD_END = 8;
const INTERLUDE = 18;                 // photos between name cards
const GRID = [480, 360], N = GRID[0] * GRID[1];   // stardust grains per photo
const FOV = 34 * Math.PI / 180;

// ===================================================================== shaders
const NOISE = `
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.-2.*f);
  return mix(mix(hash12(i), hash12(i+vec2(1,0)), u.x), mix(hash12(i+vec2(0,1)), hash12(i+vec2(1,1)), u.x), u.y); }
float fbm(vec2 p){ float v = 0., a = .5; mat2 r = mat2(.8,-.6,.6,.8);
  for (int i = 0; i < 6; i++){ v += a*vnoise(p); p = r*p*2.03 + vec2(1.7, 9.2); a *= .5; } return v; }
`;
// shared by the photo and its dust, so both agree on where the edges have turned to dust
const EDGE = `
float edgeMask(vec2 uv, vec2 size, float t){
  float ed = min(min(uv.x*size.x, (1.-uv.x)*size.x), min(uv.y*size.y, (1.-uv.y)*size.y));
  float Z = .06*min(size.x, size.y);
  float n = vnoise(uv*vec2(size.x/size.y, 1.)*6. + vec2(t*.04, -t*.025)) - .5;
  return 1. - smoothstep(0., Z, ed + n*Z*1.1);
}
`;
// when the dissolve front reaches a point: the photo and its dust share it, so they hand off seamlessly
const SWEEP = `
float sweepJitter(vec2 uv, vec2 size){ vec2 q = uv*size; return vnoise(q/110.)*.7 + vnoise(q/26. + 7.)*.3; }
float sweepT(vec2 uv, float jitter, float p, float wind){
  float s = wind > 0. ? uv.x : 1. - uv.x;
  float d = (s*.76 + jitter*.24) * .66;
  return clamp((p - d) / .34, 0., 1.);
}
`;
// contrast grade laid over every photo: deeper blacks, gentle S-curve, cool shadows / warm highlights, inner vignette
const GRADE = `
vec3 grade(vec3 c, vec2 uv){
  c = clamp((c - .035) / .95, 0., 1.);
  c = mix(c, c*c*(3. - 2.*c), .36);
  float l = dot(c, vec3(.3, .59, .11));
  c = mix(vec3(l), c, .92);
  c *= mix(vec3(.92, .96, 1.07), vec3(1.04, 1., .94), smoothstep(.12, .8, l));
  c *= mix(.76, 1., smoothstep(.66, .2, length((uv - .5)*vec2(1.04, 1.))));
  return c;
}
`;

const VS_FULL = `#version 300 es
out vec2 vUv;
void main(){ vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); vUv = p; gl_Position = vec4(p*2.-1., 0, 1); }`;

const FS_NEBULA = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform float uTime, uAspect; uniform vec2 uCam; uniform vec3 uTone;
${NOISE}
void main(){
  vec2 uv = (vUv - .5) * vec2(uAspect, 1.);
  vec2 p = uv*1.45 + uCam*.00022;
  float t = uTime*.009;
  vec2 q = vec2(fbm(p + t), fbm(p + vec2(5.2, 1.3) - t));
  vec2 r = vec2(fbm(p + 3.2*q + vec2(1.7, 9.2) + t*1.3), fbm(p + 3.2*q + vec2(8.3, 2.8) - t*.8));
  float f = fbm(p + 2.6*r);
  float band = exp(-pow(uv.y*1.15 + uv.x*.42 + .08*sin(uv.x*2.3 + t*4.), 2.) * 3.6);
  float dens = smoothstep(.4, 1., f);
  vec3 violet = mix(vec3(.17, .1, .4), uTone, .32);
  vec3 teal   = mix(vec3(.03, .2, .34), uTone.bgr, .2);
  vec3 ember  = mix(vec3(.9, .55, .38), uTone, .3);
  vec3 col = vec3(.002, .003, .011) + vec3(.004, .005, .016)*(1. - vUv.y);
  col += violet * dens * (.08 + .5*band);
  col += teal * pow(length(q), 2.4) * .1 * (.25 + band);
  col += ember * pow(f, 6.) * band * .7;
  col *= 1. - .7*smoothstep(.48, .76, fbm(p*2.3 - r*1.4 + 4.))*band;      // dark dust lanes
  float m = smoothstep(1.1, .2, length(uv*vec2(.75, 1.1)));              // darker toward the frame edges
  o = vec4(col * mix(.45, 1., m), 1.);
}`;

const FS_COPY = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o; uniform sampler2D uTex;
void main(){ o = vec4(texture(uTex, vUv).rgb, 1.); }`;

const VS_STAR = `#version 300 es
precision highp float;
in vec3 aPos; in vec4 aInfo;            // size, phase, warm, birth
uniform mat4 uVP; uniform float uTime, uDpr; uniform vec4 uHover;   // world xyz of the star being read, amount
out vec3 vCol;
void main(){
  vec4 clip = uVP * vec4(aPos, 1.); gl_Position = clip;
  float hov = uHover.w * step(distance(aPos, uHover.xyz), 1.);
  float sp = .4 + fract(aInfo.y*7.31)*1.6;
  float tw = .66 + .34*sin(uTime*sp + aInfo.y*6.283) * sin(uTime*sp*.37 + aInfo.y*17.);
  float born = aInfo.w > -1. ? 1. : 0.;
  float age = uTime - aInfo.w;
  float grow = mix(1., smoothstep(0., 2.4, age), born);
  float flash = born * exp(-age*.9) * 2.2;
  gl_PointSize = max(aInfo.x * (1. + flash*.3 + hov*.9) * grow * uDpr * 5., 1.);
  vec3 c = mix(vec3(.76, .83, 1.), vec3(1., .8, .55), aInfo.z);
  vCol = c * (tw + flash + hov*1.6) * mix(1.1, 2.2, aInfo.z) * grow;
}`;
const FS_STAR = `#version 300 es
precision highp float; in vec3 vCol; out vec4 o;
void main(){ vec2 c = gl_PointCoord*2.-1.; float r2 = dot(c, c); if (r2 > 1.) discard;
  float core = exp(-r2*26.), halo = exp(-r2*5.)*.18;
  float spike = (exp(-abs(c.x)*30.) + exp(-abs(c.y)*30.)) * exp(-r2*3.) * .14;
  o = vec4(vCol*(core + halo + spike), 0.); }`;

const VS_METEOR = `#version 300 es
precision highp float;
uniform mat4 uVP; uniform vec3 uHead, uDir; uniform float uLen, uAlpha, uDpr;
out vec3 vCol;
void main(){ float k = float(gl_VertexID)/63.;
  vec4 clip = uVP * vec4(uHead - uDir*uLen*k, 1.); gl_Position = clip;
  gl_PointSize = mix(2.6, .7, k) * uDpr * 4.;
  vCol = vec3(.85, .9, 1.) * pow(1. - k, 1.8) * uAlpha * 1.2; }`;

const VS_PLANE = `#version 300 es
precision highp float;
uniform mat4 uVP; uniform vec4 uRect;
out vec2 vUv;
void main(){ vec2 q = vec2(gl_VertexID & 1, gl_VertexID >> 1);
  vUv = q; gl_Position = uVP * vec4(uRect.xy + (q - .5)*uRect.zw, 0., 1.); }`;
const FS_PLANE = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uTex; uniform float uTime, uP, uWind; uniform vec4 uRect; uniform int uGrade, uIncoming;
${NOISE}${EDGE}${SWEEP}${GRADE}
void main(){
  vec4 c = texture(uTex, vUv);                      // premultiplied
  if (uGrade == 1) c.rgb = grade(c.rgb, vUv) * c.a;
  float t = sweepT(vUv, sweepJitter(vUv, uRect.zw), uP, uWind);
  float a = uIncoming == 1 ? smoothstep(.38, .86, t) : 1. - smoothstep(.14, .62, t);
  o = c * a * (1. - edgeMask(vUv, uRect.zw, uTime));
}`;

const VS_DUST = `#version 300 es
precision highp float; precision highp int;
uniform mat4 uVP; uniform float uTime, uP, uDpr, uFocal, uWind;
uniform int uHasA, uGradeA, uGradeB;
uniform ivec2 uGrid;
uniform sampler2D uTexA, uTexB; uniform float uLodA, uLodB;
uniform vec4 uRectA, uRectB;
out vec4 vCol; out float vAdd, vSoft;
${NOISE}${EDGE}${SWEEP}${GRADE}
uint hu(uint x){ x ^= x >> 16; x *= 0x7feb352du; x ^= x >> 15; x *= 0x846ca68bu; x ^= x >> 16; return x; }
float rnd(uint i, uint k){ return float(hu(i*9u + k)) / 4294967295.; }
vec3 unpre(vec4 c){ return c.rgb / max(c.a, .002); }
const float PI = 3.14159265;

void main(){
  uint i = uint(gl_VertexID);
  float r1 = rnd(i, 1u), r2 = rnd(i, 2u), r3 = rnd(i, 3u), r4 = rnd(i, 4u), r5 = rnd(i, 5u);
  vec2 uv = (vec2(float(i % uint(uGrid.x)), float(i / uint(uGrid.x))) + vec2(r1, r2)) / vec2(uGrid);
  vec4 cA = textureLod(uTexA, uv, uLodA), cB = textureLod(uTexB, uv, uLodB);
  vec3 colA = unpre(cA), colB = unpre(cB);
  if (uGradeA == 1) colA = grade(colA, uv);
  if (uGradeB == 1) colB = grade(colB, uv);
  vec3 B = vec3(uRectB.xy + (uv - .5)*uRectB.zw, 0.);
  vec3 A = vec3(uRectA.xy + (uv - .5)*uRectA.zw, 0.);
  float aA = cA.a;
  if (uHasA == 0) { A = B + vec3(-uWind*(90. + 140.*r3), (r4 - .5)*70., (r5 - .5)*140.); colA = colB; aA = 0.; }

  // one soft sweep: at the front each grain lifts off, rides a slow breeze and settles into the next memory
  float t = sweepT(uv, sweepJitter(uv, uRectB.zw)*.85 + r1*.15, uP, uWind);
  float e5 = t*t*t*(t*(t*6. - 15.) + 10.);
  float arc = sin(t*PI);
  float bz = vnoise(uv*3.2 + vec2(uTime*.04, 0.)) - .5;
  vec3 drift = vec3(uWind*(18. + 48.*r3), bz*40. + 8., (r4 - .5)*50.);
  vec3 P = mix(A, B, e5) + drift*arc;

  // the resting photo's edges slowly evaporate into the sky
  float e = edgeMask(uv, uRectB.zw, uTime) * t;
  float ph = fract(uTime*.04 + r2*7.);
  P += vec3((r3 - .5)*.7, .3 + r4*.5, (r5 - .5)) * 34. * ph * e;

  vec3 glow = vec3(.86, .9, 1.) * (1. + .9*pow(r5, 12.));
  vec3 col = mix(colA, colB, smoothstep(.35, .65, t));
  col = mix(col, glow, arc*.12);
  col = mix(col, colB*.85 + glow*.12, min(e*ph*1.3, 1.));

  float alpha = mix(aA, cB.a, t);
  float front = smoothstep(0., .25, t) * (1. - smoothstep(.75, 1., t)) * step(r3, .32);  // only a sparse shimmer travels
  float edgeShow = e * (1. - ph) * smoothstep(0., .06, ph) * .6;
  alpha *= max(front * .7, edgeShow);

  float g = max(mix(uRectA.z, uRectB.z, t)/float(uGrid.x), mix(uRectA.w, uRectB.w, t)/float(uGrid.y)) * 1.55;
  float size = g * (1. - .3*arc) * mix(1., .75, min(e*ph*1.5, 1.));

  vec4 clip = uVP * vec4(P, 1.);
  gl_Position = alpha < .004 ? vec4(2., 2., 2., 1.) : clip;
  gl_PointSize = clamp(size * uDpr * uFocal / clip.w, 1., 64.);
  vCol = vec4(col, alpha);
  vAdd = clamp(arc*.35 + e*.7, 0., 1.);
  vSoft = clamp(arc*1.6 + e, 0., 1.);
}`;
const FS_DUST = `#version 300 es
precision highp float;
in vec4 vCol; in float vAdd, vSoft; out vec4 o;
void main(){ vec2 c = gl_PointCoord*2.-1.; float r2 = dot(c, c); if (r2 > 1.) discard;
  float a = mix(1. - smoothstep(.5, 1., r2), exp(-r2*4.), vSoft) * vCol.a;
  o = vec4(vCol.rgb*a, a*(1. - vAdd)); }`;

const FS_BRIGHT = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o; uniform sampler2D uTex; uniform float uThr;
void main(){ vec3 c = texture(uTex, vUv).rgb; float b = max(c.r, max(c.g, c.b));
  float k = clamp(b - uThr + .25, 0., .5); k = k*k/(2.*.25*2.);
  o = vec4(c * max(k, b - uThr) / max(b, 1e-4), 1.); }`;
const FS_DOWN = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o; uniform sampler2D uTex; uniform vec2 uTexel;
void main(){ vec2 h = uTexel;
  o = (texture(uTex, vUv)*4. + texture(uTex, vUv - h) + texture(uTex, vUv + h) + texture(uTex, vUv + vec2(h.x, -h.y)) + texture(uTex, vUv - vec2(h.x, -h.y))) / 8.; }`;
const FS_UP = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o; uniform sampler2D uTex; uniform vec2 uTexel;
void main(){ vec2 h = uTexel;
  vec4 s = texture(uTex, vUv + vec2(-2.*h.x, 0.)) + texture(uTex, vUv + vec2(2.*h.x, 0.)) + texture(uTex, vUv + vec2(0., 2.*h.y)) + texture(uTex, vUv + vec2(0., -2.*h.y));
  s += (texture(uTex, vUv + vec2(-h.x, h.y)) + texture(uTex, vUv + h) + texture(uTex, vUv + vec2(h.x, -h.y)) + texture(uTex, vUv - h)) * 2.;
  o = s / 12.; }`;
const FS_FINAL = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o;
uniform sampler2D uScene, uBloom; uniform float uTime, uAspect, uFade, uBloomK;
float h(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y)*p3.z); }
vec3 shoulder(vec3 x){ vec3 k = vec3(.8); return mix(x, k + (1. - k)*tanh((x - k)/(1. - k)), step(k, x)); }
void main(){
  vec2 d = vUv - .5; float ca = dot(d, d) * .006;
  vec3 c = vec3(texture(uScene, vUv + d*ca).r, texture(uScene, vUv).g, texture(uScene, vUv - d*ca).b);
  c += texture(uBloom, vUv).rgb * uBloomK;
  c = shoulder(c);
  float v = length(d*vec2(uAspect, 1.)*vec2(.92, 1.15));
  c *= mix(.3, 1., smoothstep(1.05, .3, v));
  c += (h(gl_FragCoord.xy + fract(uTime*7.1)*391.) - .5) * .026;
  o = vec4(max(c, 0.) * uFade, 1.);
}`;

// ===================================================================== GL helpers
function program(vs, fs) {
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) + "\n" + src.split("\n").map((l, i) => (i + 1) + ": " + l).join("\n"));
    gl.attachShader(p, s);
  }
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name; u[name] = gl.getUniformLocation(p, name); }
  return { p, u };
}
const P = {
  nebula: program(VS_FULL, FS_NEBULA), copy: program(VS_FULL, FS_COPY),
  star: program(VS_STAR, FS_STAR), meteor: program(VS_METEOR, FS_STAR),

function loadScript(src) { return new Promise((ok, fail) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s); }); }
async function connectLights() {
  if (CFG.url && CFG.anonKey) {
    try {
      await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js");
      sb = window.supabase.createClient(CFG.url, CFG.anonKey, { auth: { persistSession: false } });
      const { data, error } = await sb.from("lights").select("id,nx,ny,z,message,name").order("created_at", { ascending: true }).limit(MAX_LIGHTS);
      if (error) throw error;
      data.forEach(r => addLight(r, false));
      sb.channel("lights").on("postgres_changes", { event: "INSERT", schema: "public", table: "lights" }, ({ new: r }) => {

// ===================================================================== frame
const t0 = performance.now();
const now = () => (performance.now() - t0) / 1000;
let last = 0, nebulaDirty = true, frameNo = 0;
resize(); addEventListener("resize", resize);
connectLights();
const startIdx = Math.max(0, parseInt(location.hash.slice(1)) || 0);
ensure(startIdx);
let waitingFirst = true;

  }

    }

    if (clock.t >= quoteEnd) quoteOff();

  }

  const tgt = sB ? sB.tone.map(v => v / 255) : [.3, .3, .6];
  const tm = Math.max(...tgt, .01);
  for (let i = 0; i < 3; i++) tone[i] += (tgt[i] / tm * .5 - tone[i]) * (1 - Math.exp(-dt / 3));

    gl.uniform1f(P.nebula.u.uTime, t); gl.uniform1f(P.nebula.u.uAspect, W / H);

      gl.uniform3f(P.meteor.u.uDir, meteor.vx, meteor.vy, 0); gl.uniform1f(P.meteor.u.uLen, 320 * Math.min(1, age * 4));

    gl.uniform1f(P.plane.u.uP, p); gl.uniform1f(P.plane.u.uWind, wind);
